[project]
name = "kquant"
version = "0.1.0"
description = "국내(KOSPI/KOSDAQ) 주식 분석 코어 — 데이터 수집, 조건 검색, 전략 백테스트, 리포트"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "plotly>=7.1.0",
    "mcp>=1.2",
]

[project.scripts]
kquant = "kquant.cli:main"
kquant-mcp = "kquant.mcp_server:main"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8",
    "ruff>=0.6",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: 실제 dataset/ 파일이 필요한 테스트 (없으면 skip)",
]

[tool.ruff]
line-length = 110
target-version = "py313"
