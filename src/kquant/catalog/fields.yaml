  periods: [latest]
  default_period: latest
- id: cash
  label: 현금및현금성자산
  aliases: [현금]
  kind: stock
  unit: KRW
  item: 현금및현금성자산
  periods: [latest]
  default_period: latest
- id: inventory
  label: 재고자산
  aliases: [재고]
  kind: stock
  unit: KRW
  item: 재고자산
  periods: [latest]
  default_period: latest
- id: receivables
  label: 매출채권
  kind: stock
  unit: KRW
  item: 매출채권
  periods: [latest]
  default_period: latest
- id: ppe
  label: 유형자산
  kind: stock
  unit: KRW
  item: 유형자산
  periods: [latest]
  default_period: latest
- id: intangibles
  label: 무형자산
  kind: stock
  unit: KRW
  item: 무형자산
  periods: [latest]
  default_period: latest
- id: short_term_debt
  label: 단기차입금
  kind: stock
  unit: KRW
  item: 단기차입금
  periods: [latest]
  default_period: latest
- id: long_term_debt
  label: 장기차입금
  kind: stock
  unit: KRW
  item: 장기차입금
  periods: [latest]
  default_period: latest
- id: retained_earnings
  label: 이익잉여금
  kind: stock
  unit: KRW
  item: 이익잉여금
  periods: [latest]
  default_period: latest
- id: capital_stock
  label: 자본금
  kind: stock
  unit: KRW
  item: 자본금
  periods: [latest]
  default_period: latest

# ---- 시세 (price) ----
- id: market_cap
  label: 시가총액
  aliases: [시총, market cap]
  kind: price
  unit: KRW
  column: Marcap
  periods: [latest]
  default_period: latest
- id: close
  label: 종가
  aliases: [주가, 가격]
  kind: price
  unit: KRW
  column: Close
  periods: [latest]
  default_period: latest
  description: 기준일 종가(수정 전 원가격).
- id: trading_value
  label: 거래대금
  aliases: [거래액]
  kind: price
  unit: KRW
  column: Amount
  periods: [latest]
  default_period: latest
  description: 기준일 하루 거래대금.

# ---- 파생 지표 (ratio) ----
- id: per
  label: PER
  aliases: [주가수익비율]
  kind: ratio
  unit: 배
  periods: [ttm, annual]
  default_period: ttm
  formula: 시가총액 / 당기순이익(지배주주). 순이익 ≤ 0이면 값 없음.
- id: pbr
  label: PBR
  aliases: [주가순자산비율]
  kind: ratio
  unit: 배
  periods: [latest]
  default_period: latest
  formula: 시가총액 / 자본총계(지배주주). 자본 ≤ 0이면 값 없음.
- id: psr
  label: PSR
  aliases: [주가매출비율]
  kind: ratio
  unit: 배
  periods: [ttm, annual]
  default_period: ttm
  formula: 시가총액 / 매출액. 매출 ≤ 0이면 값 없음.
- id: pcr
  label: PCR
  aliases: [주가현금흐름비율]
  kind: ratio
  unit: 배
  periods: [ttm, annual]
  default_period: ttm
  formula: 시가총액 / 영업활동현금흐름. 현금흐름 ≤ 0이면 값 없음.
- id: roe
  label: ROE
  aliases: [자기자본이익률]
  kind: ratio
  unit: "%"
  periods: [ttm]
  default_period: ttm
  formula: 당기순이익(지배주주, TTM) / 자본총계(지배주주, 최신) × 100. 자본 ≤ 0이면 값 없음.
- id: roa
  label: ROA
  aliases: [총자산이익률]
  kind: ratio
  unit: "%"
  periods: [ttm]
  default_period: ttm
  formula: 당기순이익(지배주주, TTM) / 자산총계(최신) × 100.
- id: debt_ratio
  label: 부채비율
  kind: ratio
  unit: "%"
  periods: [latest]
  default_period: latest
  formula: 부채총계 / 자본총계 × 100. 자본 ≤ 0이면 값 없음.
- id: operating_margin
  label: 영업이익률
  kind: ratio
  unit: "%"
  periods: [quarter, ttm, annual]
  default_period: null
  formula: 영업이익 / 매출액 × 100. 매출 ≤ 0이면 값 없음.
- id: net_margin
  label: 순이익률
  kind: ratio
  unit: "%"
  periods: [quarter, ttm, annual]
  default_period: null
  formula: 당기순이익(지배주주) / 매출액 × 100. 매출 ≤ 0이면 값 없음.
- id: revenue_growth
  label: 매출액 성장률(전년 동기 대비)
  aliases: [매출 성장률, 매출증가율]
  kind: ratio
  unit: "%"
  periods: [quarter, ttm]
  default_period: null
  formula: (이번 값 − 전년 동기 값) / 전년 동기 값 × 100. 전년 동기 값 ≤ 0이면 값 없음.
- id: operating_income_growth
  label: 영업이익 성장률(전년 동기 대비)
  aliases: [영업이익 증가율]
  kind: ratio
  unit: "%"
  periods: [quarter, ttm]
  default_period: null
  formula: (이번 값 − 전년 동기 값) / 전년 동기 값 × 100. 전년 동기 값 ≤ 0이면 값 없음.
- id: net_income_growth
  label: 순이익 성장률(전년 동기 대비)
  aliases: [순이익 증가율]
  kind: ratio
  unit: "%"
  periods: [quarter, ttm]
  default_period: null
  formula: (이번 값 − 전년 동기 값) / 전년 동기 값 × 100. 전년 동기 값 ≤ 0이면 값 없음.
