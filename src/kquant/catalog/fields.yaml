# 조건 검색 카탈로그 — 검색 가능한 항목의 유일한 정의 (spec §6.1).
# kind: flow(기간 값) | stock(시점 값) | price(시세) | ratio(파생 지표)
# periods: quarter(분기 3개월) | ttm(최근 12개월) | annual(직전 연간) | latest(최신 시점)
# default_period: null이면 기간을 지정하지 않은 조건은 실행하지 않고 되묻는다.
# 재무 항목: item = kquant.fin.snapshot 컬럼의 항목명. 비율: 계산은 kquant.catalog.features의 RATIOS.

# ---- 손익·현금흐름 (flow) ----
- id: revenue
  label: 매출액
  aliases: [매출, 수익, sales]
  kind: flow
  unit: KRW
  item: 매출액
  periods: [quarter, ttm, annual]
  default_period: null
- id: gross_profit
  label: 매출총이익
  aliases: [매출이익]
  kind: flow
  unit: KRW
  item: 매출총이익
  periods: [quarter, ttm, annual]
  default_period: null
- id: operating_income
  label: 영업이익
  aliases: [영업익, operating profit]
  kind: flow
  unit: KRW
  item: 영업이익
  periods: [quarter, ttm, annual]
  default_period: null
- id: pretax_income
  label: 법인세차감전순이익
  aliases: [세전이익]
  kind: flow
  unit: KRW
  item: 법인세차감전순이익
  periods: [quarter, ttm, annual]
  default_period: null
- id: net_income
  label: 당기순이익(지배주주)
  aliases: [순이익, 당기순이익, 지배순이익, net income]
  kind: flow
  unit: KRW
  item: 지배당기순이익
  periods: [quarter, ttm, annual]
  default_period: null
  description: 지배기업 소유주 귀속 당기순이익. 해당 줄이 없는 기업은 당기순이익.
- id: operating_cash_flow
  label: 영업활동현금흐름
  aliases: [영업현금흐름, OCF]
  kind: flow
  unit: KRW
  item: 영업활동현금흐름
  periods: [quarter, ttm, annual]
  default_period: null
- id: capex
  label: 유형자산취득
  aliases: [설비투자, CAPEX]
  kind: flow
  unit: KRW
  item: 유형자산취득
  periods: [quarter, ttm, annual]
  default_period: null
- id: dividends_paid
  label: 배당금지급
  aliases: [배당금]
  kind: flow
  unit: KRW
  item: 배당금지급
  periods: [quarter, ttm, annual]
  default_period: null
  description: 현금흐름표의 배당금 지급액.

# ---- 재무상태 (stock) ----
- id: total_assets
  label: 자산총계
  aliases: [자산, 총자산]
  kind: stock
  unit: KRW
  item: 자산총계
  periods: [latest]
  default_period: latest
- id: total_liabilities
  label: 부채총계
  aliases: [부채, 총부채]
  kind: stock
  unit: KRW
  item: 부채총계
  periods: [latest]
  default_period: latest
- id: total_equity
  label: 자본총계(지배주주)
  aliases: [자본, 자기자본, 순자산]
  kind: stock
  unit: KRW
  item: 지배자본총계
  periods: [latest]
  default_period: latest
  description: 자본총계에서 비지배지분을 뺀 값.
- id: current_assets
  label: 유동자산
  kind: stock
  unit: KRW
