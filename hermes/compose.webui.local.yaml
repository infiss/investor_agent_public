# 로컬 1인용 채팅 환경(2026-11-10): Open WebUI(웹 채팅) + 리포트 정적 서버. 이 PC에서만(127.0.0.1) 쓴다 — 공개 배포용 아님.
#
#   브라우저 http://127.0.0.1:3000  →  Open WebUI  →  Hermes kquantpub 게이트웨이(호스트 :8643)  →  kquant MCP(compose `mcp`)
#   리포트 링크 http://127.0.0.1:8650/report-….html  ←  reports(nginx, dataset/reports 읽기 전용)
#
# 준비: 1) Docker Desktop 실행  2) Hermes 프로필 kquantpub의 mcp_servers.kquant-public.env에
#          KQUANT_REPORT_BASE_URL: http://127.0.0.1:8650  3) `hermes -p kquantpub gateway run`(별도 창)
# 실행(PowerShell, 저장소 루트):
#   $env:HERMES_API_KEY = (Get-Content "$env:LOCALAPPDATA\hermes\profiles\kquantpub\.env" | Select-String '^API_SERVER_KEY=').Line.Split('=',2)[1]
#   docker compose -f hermes/compose.webui.local.yaml up -d
# 종료: docker compose -f hermes/compose.webui.local.yaml down   (대화 기록은 볼륨 open-webui-data에 남는다)
#
# Hermes API 키는 실행할 때 환경변수로만 넘긴다(파일에 쓰지 않음). 설정을 DB에 저장하지 않으므로(ENABLE_PERSISTENT_CONFIG=false)
# 키를 바꾸면 환경변수를 바꿔 다시 up 하면 된다.

name: kquant-webui-local

services:
  open-webui:
    # 2026-11-10 받은 이미지(2026-11-08 빌드) digest 고정
    image: ghcr.io/open-webui/open-webui:main@sha256:59b912d4246103c7285de0e9a5f2f6586614c06b4c4e46edc51a8f29e7b099a5
    restart: "no"
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://host.docker.internal:8643/v1
      OPENAI_API_KEY: ${HERMES_API_KEY:?HERMES_API_KEY를 kquantpub 프로필 .env의 API_SERVER_KEY로 설정}
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "false"                      # 1인 로컬용(127.0.0.1에만 열림). 공개 배포에서는 켠다
      # 채팅 외 보조 요청(제목·태그·후속 질문·자동완성)을 끈다: 요청마다 Hermes 에이전트가 따로 돌아 도구까지 부르기 때문
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_CODE_EXECUTION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      # 투자 권유 아님 고지를 화면 상단에 항상 표시(dismissible=false: ×로 닫아도 새로고침·재접속하면 다시 표시 — Open WebUI는 ×를 항상 그린다). 모델이 도구 없이 답할 때(추천 거절·되묻기) 고지를
      # 빠뜨려도 화면에는 남게 한다(2026-11-13 결정). 문구는 kquant.disclaimer.DISCLAIMER와 같아야 한다(테스트로 고정).
      # Open WebUI는 첫 실행 때 설정 전체를 DB에 저장하고 이후 DB 값을 우선한다. 기존 볼륨에도 배너가 적용되고 관리자 화면에서
      # 지울 수 없게 설정은 이 파일(환경변수)에서만 읽는다. 관리자 화면에서 바꾼 설정은 재시작하면 이 파일 값으로 돌아간다.
      ENABLE_PERSISTENT_CONFIG: "false"
      WEBUI_BANNERS: >-
        [{"id": "kquant-disclaimer", "type": "warning", "title": "",
        "content": "본 정보는 과거 데이터에 기반한 분석 자료이며 투자 권유가 아닙니다. 매매 판단과 그 결과의 책임은 이용자에게 있습니다. 이 에이전트는 종목을 추천하지 않습니다.",
        "dismissible": false, "timestamp": 1794528000}]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data

  reports:
    image: nginx:alpine
    restart: "no"
    ports:
      - "127.0.0.1:8650:80"
    volumes:
      - ../dataset/reports:/usr/share/nginx/html:ro

volumes:
  open-webui-data:
